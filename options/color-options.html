<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hide &amp; Highlight · Colors</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="options-page">
  <main class="options-card">
    <header class="options-header"><img src="../images/icon-48.png" width="40" height="40" alt=""><div><p class="eyebrow">Hide &amp; Highlight</p><h1 data-i18n="optionsTitle"></h1></div></header>
    <div class="large-preview"><span data-i18n="previewLabel"></span><mark id="color-preview" data-i18n="previewText"></mark></div>
    <form id="colors-form">
      <div class="color-setting"><label for="background-color" data-i18n="backgroundColor"></label><input type="color" id="background-color"></div>
      <div class="color-setting"><label for="text-color" data-i18n="textColor"></label><input type="color" id="text-color"></div>
      <label class="check shadow-toggle"><input type="checkbox" id="use-shadow"><span data-i18n="useShadow"></span></label>
      <div class="color-setting"><label for="shadow-color" data-i18n="shadowColor"></label><input type="color" id="shadow-color"></div>
      <div class="options-buttons"><button type="submit" class="primary" data-i18n="saveColors"></button><button type="button" class="quiet" id="restore-colors" data-i18n="restoreColors"></button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <button class="text-button return-button" id="return-tab" data-i18n="returnTab" type="button" hidden></button>
    <footer><span class="privacy-dot" aria-hidden="true"></span><span data-i18n="privacy"></span></footer>
  </main>
  <script src="../scripts/shared.js"></script>
  <script src="../scripts/i18n.js"></script>
  <script src="color-options.js"></script>
</body>
</html>
